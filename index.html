<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mellodest | Dj Mello</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 5px;
    }

    .username {
      color: #aaa;
      font-size: 20px;
    }

    .card {
      background: #171717;
      border-radius: 20px;
      padding: 30px;
      margin-top: 30px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 25px 0;
    }

    .number {
      font-size: 25px;
      font-weight: bold;
    }

    .label {
      color: #aaa;
    }

    a {
      display: block;
      background: #ff2450;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
      font-weight: bold;
    }

    .note {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Mellodest</h1>
    <div class="username">@mellodest</div>

    <div class="card">
      <h2>Dj Mello</h2>

      <div class="stats">
        <div>
          <div class="number">807K+</div>
          <div class="label">Followers</div>
        </div>

        <div>
          <div class="number">13.2M+</div>
          <div class="label">Likes</div>
        </div>
      </div>

      <p>
        Mellodest is a digital content creator known for
        entertaining and viral TikTok content.
      </p>

      <a href="https://www.tiktok.com/@mellodest">
        TikTok — @mellodest
      </a>

      <p class="note">
        Official profile and creator information.
      </p>
    </div>

  </div>
</body>
</html>
